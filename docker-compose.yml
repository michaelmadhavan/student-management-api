# Runs MySQL + Redis + the app with one command:  docker compose up --build
# Password below is for LOCAL DEMO only. Override with a .env file (DB_PASSWORD=...).
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-student123}
      MYSQL_DATABASE: student_db
    ports:
      - "3307:3306"   # 3307 on your PC, so it never clashes with a local MySQL on 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-student123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: student_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-student123}
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data:
